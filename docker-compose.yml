services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opsassist
      POSTGRES_USER: opsassist
      POSTGRES_PASSWORD: opsassist
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsassist -d opsassist"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - ./data:/workspace/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/events
    depends_on:
      api:
        condition: service_healthy
    ports: ["3000:3000"]

volumes:
  postgres-data:
