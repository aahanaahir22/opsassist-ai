name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/app apps/api/tests scripts
      - run: mypy apps/api/app
      - run: python scripts/build_index.py
      - run: python scripts/evaluate_retrieval.py
      - run: pytest apps/api/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  containers-and-security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: docker build -f apps/api/Dockerfile -t opsassist-api .
      - run: docker build -f Dockerfile.web -t opsassist-web .
