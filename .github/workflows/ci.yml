name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check apps/api/app apps/api/tests scripts
      - run: mypy apps/api/app
      - name: Verify production migrations
        run: |
          export OPSASSIST_DATABASE_URL=sqlite:///$RUNNER_TEMP/alembic.db
          (cd apps/api && alembic -c alembic.ini upgrade head)
          (cd apps/api && alembic -c alembic.ini upgrade head)
      - run: python scripts/build_index.py
      - run: python scripts/evaluate_retrieval.py
      - run: pytest apps/api/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }

  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e apps/api
      - run: PYTHONPATH=apps/api OPSASSIST_DATA_DIR=$PWD/data uvicorn app.main:app --host 127.0.0.1 --port 8000 &
      - run: |
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8000/api/v1/health && exit 0; sleep 1; done
          exit 1
      - uses: grafana/setup-k6-action@v1
      - run: k6 run --vus 5 --duration 10s tests/load/api-workflow.js

  containers-and-security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: pip install -e 'apps/api[dev]'
      - run: bandit -r apps/api/app -q
      - run: pip-audit --desc on
      - run: docker build -f apps/api/Dockerfile -t opsassist-api .
      - run: docker build -f apps/indexer/Dockerfile -t opsassist-indexer .
      - run: docker build -f Dockerfile.web -t opsassist-web .
      - uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: opsassist-api
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
