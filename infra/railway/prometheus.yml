global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: opsassist-api
    metrics_path: /metrics
    static_configs:
      - targets: ["opsassist-api.railway.internal:8000"]
  - job_name: opsassist-otel
    static_configs:
      - targets: ["opsassist-otel.railway.internal:8889"]
