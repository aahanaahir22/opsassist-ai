[project]
name = "opsassist-api"
version = "1.0.0"
description = "Evidence-backed synthetic incident investigation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "networkx>=3.4,<4",
  "python-json-logger>=3.2,<4",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "PyJWT[crypto]>=2.10,<3",
  "openai>=1.75,<2",
  "redis>=5.2,<7",
  "prometheus-client>=0.21,<1",
  "sentry-sdk[fastapi]>=2.22,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.9,<0.10", "mypy>=1.14,<2", "fakeredis>=2.26,<3", "pip-audit>=2.8,<3", "bandit>=1.8,<2"]
semantic = ["sentence-transformers>=3.3,<4", "faiss-cpu>=1.9,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
